# Compose untuk VM Ubuntu: pakai image dari Docker Hub, tanpa build.
#
# Di VM, siapkan folder berisi:
#   docker-compose.yml  (file ini, di-rename)
#   backend.env         (isi dari backend/.env di laptop)
#   .env                (WEB_PORT, ALLOWED_ORIGINS, TAG - opsional)
#
# Jalankan:  docker compose pull && docker compose up -d
services:
  backend:
    image: felixfanady07/marketexe-backend:${TAG:-latest}
    restart: unless-stopped
    env_file: ./backend.env
    environment:
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://marketexe.felixfanady.com}
      USERS_DB_PATH: /data/users.db
    volumes:
      - users-data:/data
    expose:
      - "8000"

  web:
    image: felixfanady07/marketexe-web:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${WEB_PORT:-9001}:80"
    volumes:
      - caddy-data:/data
      - caddy-config:/config

volumes:
  users-data:
  caddy-data:
  caddy-config:
